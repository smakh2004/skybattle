<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Sky Blitz</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="icon" href="data:," />
  <!-- ?v=N on css/js (and, through main.js, on the .riv files): bump it with every update so
       browsers load the new files at once instead of a cached copy -->
  <link rel="stylesheet" href="css/style.css?v=14" />
  <script>
    // Static hosting cannot send the cross-origin isolation headers Rive needs for its threads;
    // coi-sw.js adds them. The first visit installs it and reloads once (never in a loop).
    (function () {
      if (window.crossOriginIsolated || !window.isSecureContext || !('serviceWorker' in navigator)) return;
      if (/^(localhost|127\.)/.test(location.hostname)) return; // serve.py already sends them
      navigator.serviceWorker.register('coi-sw.js').then(function () {
        if (sessionStorage.getItem('coi-reloaded')) return;
        sessionStorage.setItem('coi-reloaded', '1');
        navigator.serviceWorker.ready.then(function () { location.reload(); });
      }).catch(function (e) { console.warn('coi-sw', e); });
    })();
  </script>
</head>
<body>
  <main id="stage" data-phase="menu">
    <!-- the game, at screen size (the camera's turn is drawn by the Rive files themselves) -->
    <div id="scene">
      <!-- world.riv "World": ocean, clouds and smoke trails -->
      <canvas id="world"></canvas>
      <!-- planes.riv: one canvas per plane (mine + the players near me) -->
      <div id="planes">
        <canvas class="plane" id="me"></canvas>
      </div>
      <!-- world.riv "Shots": tracers, rockets, power-ups, shields, weapon panels and the HUD bar,
           drawn by the solo game's own code (overlay.luau) -->
      <canvas id="shots"></canvas>
    </div>

    <!-- name tags over the other planes, arrows to players off screen -->
    <div id="tags" aria-hidden="true"></div>

    <!-- the scoreboard, top right (the HUD bar along the bottom is drawn by Rive) -->
    <header id="hud">
      <aside class="board" aria-label="Leaderboard">
        <div class="board-head"><span class="board-kicker">PILOTS</span><span id="boardCount">1 ONLINE</span></div>
        <div class="board-rule"></div>
        <ol id="boardList"></ol>
      </aside>
    </header>
    <div id="feed" aria-live="polite"></div>
    <div id="banner" aria-live="assertive"></div>
    <div id="help">
      <b>A / D</b> turn &nbsp;·&nbsp; <b>W / S</b> throttle &nbsp;·&nbsp; <b>Space</b> fire &nbsp;·&nbsp; <b>Q</b> rocket &nbsp;·&nbsp; <b>V</b> wide view &nbsp;·&nbsp; <b>M</b> sound &nbsp;·&nbsp; <b>Esc</b> menu
    </div>

    <!-- touch controls -->
    <div id="stick" aria-hidden="true"><div id="knob"></div></div>
    <button id="fireBtn" aria-label="Fire">FIRE</button>
    <button id="rocketBtn" aria-label="Fire a rocket">ROCKET</button>
    <button id="exitBtn" aria-label="Back to menu">✕</button>

    <!-- the main menu: the solo game's MainMenu, drawn by Rive (world.riv "Shots", overlay.luau);
         here only the name field (invisible, over its button) and the plane on show -->
    <section id="menu" aria-label="Main menu">
      <input id="nameInput" type="text" maxlength="16" aria-label="Your name" autocomplete="off" spellcheck="false" />
      <div class="status" id="menuStatus"></div>
      <div class="showcase">
        <canvas id="menuPlane"></canvas>
      </div>
    </section>

    <!-- connecting to the arena (after PLAY) -->
    <div id="connect" aria-hidden="true">
      <div class="cx-core">
        <div class="cx-ring r1"></div>
        <div class="cx-ring r2"></div>
        <div class="cx-ring r3"></div>
        <div class="cx-hex"></div>
      </div>
      <div class="cx-text">CONNECTING TO ARENA</div>
      <div class="cx-bar"><i></i></div>
      <div class="cx-sub">SYNCING PILOTS · RADAR LINK</div>
    </div>
    <div id="loading">Loading…</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@rive-app/webgl2-threads@2.50.0/rive.js" crossorigin></script>
  <script type="module" src="js/main.js?v=14"></script>
</body>
</html>
