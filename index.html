<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Sky Blitz</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="icon" href="data:," />
  <!-- ?v=N on css/js (and, through main.js, on the .riv files): bump it with every update so
       browsers load the new files at once instead of a cached copy -->
  <link rel="stylesheet" href="css/style.css?v=10" />
  <script>
    // Static hosting cannot send the cross-origin isolation headers Rive needs for its threads;
    // coi-sw.js adds them. The first visit installs it and reloads once (never in a loop).
    (function () {
      if (window.crossOriginIsolated || !window.isSecureContext || !('serviceWorker' in navigator)) return;
      if (/^(localhost|127\.)/.test(location.hostname)) return; // serve.py already sends them
      navigator.serviceWorker.register('coi-sw.js').then(function () {
        if (sessionStorage.getItem('coi-reloaded')) return;
        sessionStorage.setItem('coi-reloaded', '1');
        navigator.serviceWorker.ready.then(function () { location.reload(); });
      }).catch(function (e) { console.warn('coi-sw', e); });
    })();
  </script>
</head>
<body>
  <main id="stage" data-phase="menu">
    <!-- the game, at screen size (the camera's turn is drawn by the Rive files themselves) -->
    <div id="scene">
      <!-- world.riv "World": ocean, clouds and smoke trails -->
      <canvas id="world"></canvas>
      <!-- planes.riv: one canvas per plane (mine + the players near me) -->
      <div id="planes">
        <canvas class="plane" id="me"></canvas>
      </div>
      <!-- world.riv "Shots": tracers, rockets, power-ups, shields, weapon panels and the HUD bar,
           drawn by the solo game's own code (overlay.luau) -->
      <canvas id="shots"></canvas>
    </div>

    <!-- name tags over the other planes, arrows to players off screen -->
    <div id="tags" aria-hidden="true"></div>

    <!-- the scoreboard, top right (the HUD bar along the bottom is drawn by Rive) -->
    <header id="hud">
      <aside class="board" aria-label="Leaderboard">
        <div class="board-head"><span>PILOTS</span><span id="boardCount">1 ONLINE</span></div>
        <ol id="boardList"></ol>
      </aside>
    </header>
    <div id="feed" aria-live="polite"></div>
    <div id="banner" aria-live="assertive"></div>
    <div id="help">
      <b>A / D</b> turn &nbsp;·&nbsp; <b>W / S</b> throttle &nbsp;·&nbsp; <b>Space</b> fire &nbsp;·&nbsp; <b>Q</b> rocket &nbsp;·&nbsp; <b>Esc</b> menu
    </div>

    <!-- touch controls -->
    <div id="stick" aria-hidden="true"><div id="knob"></div></div>
    <button id="fireBtn" aria-label="Fire">FIRE</button>
    <button id="rocketBtn" aria-label="Fire a rocket">ROCKET</button>
    <button id="exitBtn" aria-label="Back to menu">✕</button>

    <!-- main menu (the solo game's SKY BLITZ menu, curved like it) -->
    <section id="menu" aria-label="Main menu">
      <div class="menu-shade"></div>
      <div class="menu-panel">
        <div class="title-group">
          <div class="kicker">SKY</div>
          <h1 class="title">BLITZ</h1>
          <div class="title-rule"></div>
          <div class="tagline">ONLINE AIR COMBAT</div>
        </div>

        <div class="rows">
          <label class="row" data-row="0">
            <span class="idx">01</span><span class="div"></span>
            <input id="nameInput" type="text" maxlength="16" placeholder="YOUR NAME" autocomplete="off" spellcheck="false" />
          </label>
          <button class="row" data-row="1" id="joinBtn">
            <span class="idx">02</span><span class="div"></span>
            <span class="row-text">JOIN BATTLE</span>
          </button>
        </div>

        <div class="status" id="menuStatus"></div>

        <div class="footer">
          <div class="footer-rule"></div>
          <span class="keychip">W / S</span><span class="hint">SELECT</span>
          <span class="keychip">ENTER</span><span class="hint">JOIN</span>
        </div>
      </div>

      <div class="showcase">
        <canvas id="menuPlane"></canvas>
      </div>
    </section>

    <!-- the menu's curve: a displacement map (built by main.js) stretching each column about the
         middle, its left end tallest, like the solo game's GFX.menuBend -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="bendFilter" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
        <feImage id="bendFilterMap" preserveAspectRatio="none" result="map" />
        <feDisplacementMap id="bendFilterDisp" in="SourceGraphic" in2="map" scale="0" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="bendBoard" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
        <feImage id="bendBoardMap" preserveAspectRatio="none" result="map" />
        <feDisplacementMap id="bendBoardDisp" in="SourceGraphic" in2="map" scale="0" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <div id="loading">Loading…</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@rive-app/webgl2-threads@2.50.0/rive.js" crossorigin></script>
  <script type="module" src="js/main.js?v=10"></script>
</body>
</html>
